<!DOCTYPE html>
<html>
    <head>
        <style>
            p{
                margin-top: 0px;
                margin-bottom: 0px;
                font-family: Roboto, Arial;
            }
            .cat{
                width: 200px;
                height: 200px;
                object-fit: cover;
            }
            .sugg{
                width: 200px;
                height: 100%; 
                box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.4);
                border-style: solid;
                border-color: gray;
                border-width: 1px;
            }
            .icon{
                width: 25px;
                height: 25px;
                border-radius: 100%;
                object-fit: cover;
                display: inline-block
            }
            .mutual{
                width: 200px;
            }
            .iconedit{
                display:inline-block;
                vertical-align: middle;
                
            }
            .mutualtextedit{
                display: inline-block;
                
            }
            .mutualtext{
                margin-bottom: 10px;
                color: rgb(96, 96, 96);
                font-size: 14px;
                
            }
            .name{
                font-weight: 700;
                margin-top: 5px;
            }
            .info{
                margin-left: 8px;
            }
            .add{
                margin-bottom: 10px;
                color: white;
                background-color: rgb(10, 102, 194);
                border-radius: 3px;
                font-size: 12px;
                padding: 8px 16px 8px 16px;
                border:none;
            }
            .mu{
                margin-top: 2px;
            }
            .fr{
                display: grid;
                grid-template-columns: 200px 200px 200px;
                column-gap: 15px;
                align-items: center;
            }
        </style>
    </head>
    
    <body>
    <div class="fr">
        <div class="sugg">
        <div><img class="cat" src="original.jpg"></div>
        <div class="info">
        <div class="name"> <p class="name"> Oliver </p></div>
        <div class="mutual">
        <div class="mu">
        <div class="iconedit"><img class="icon" src="original.jpg"></div>
        <div class="mutualtextedit"><p class="mutualtext">2 mutual friends</p></div></div>
        <div><button class="add"> Add Friend</button></div>
        </div>
        </div>
        </div>

        <div class="sugg">
        <div><img class="cat" src="original.jpg"></div>
        <div class="info">
        <div class="name"> <p class="name"> Mimi </p></div>
        <div class="mutual">
        <div class="mu">
        <div class="iconedit"><img class="icon" src="original.jpg"></div>
        <div class="mutualtextedit"><p class="mutualtext">3 mutual friends</p></div></div>
        <div><button class="add"> Add Friend</button></div>
        </div>
        </div>
        </div>
        
        <div class="sugg">
        <div><img class="cat" src="original.jpg"></div>
        <div class="info">
        <div class="name"> <p class="name"> Rex </p></div>
        <div class="mutual">
        <div class="mu">
        <div class="iconedit"><img class="icon" src="original.jpg"></div>
        <div class="mutualtextedit"><p class="mutualtext">4 mutual friends</p></div></div>
        <div><button class="add"> Add Friend</button></div>
        </div>
        </div>
        
    </div>
    </body>
</html>
