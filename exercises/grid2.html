<!DOCTYPE html>
<html>
    <head>
        <style>
            p{
                margin-top: 0px;
                margin-bottom: 0px;
            }
        </style>
    </head>

    <body>
        <div style="
            display: grid;
            grid-template-columns: 200px 75px;
            ">
            <div style="background-color: lightblue;"><p> 200px</p></div>
            <div style="background-color: lightpink"><p>75px</p></div>
        </div>

         <div style="
            display: grid;
            grid-template-columns: 50px 1fr 75px;
            margin-top: 10px;
            ">
            <div style="background-color: lightblue;"><p> col1</p></div>
            <div style="background-color: lightpink"><p>col2</p></div>
            <div style="background-color: lightblue;"><p> col3</p></div>
        </div>

         <div style="
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            margin-top: 10px;
            column-gap: 20px;
            row-gap: 10px;
            ">
            <div style="background-color: lightblue;"><p> col1</p></div>
            <div style="background-color: lightpink"><p>col2</p></div>
            <div style="background-color: lightblue;"><p> col3</p></div>
            <div style="background-color: lightpink"><p>col4</p></div>
            <div style="background-color: lightblue;"><p> col5</p></div>
            <div style="background-color: lightpink"><p>col6</p></div>
            <div style="background-color: lightblue;"><p> col7</p></div>
            <div style="background-color: lightpink"><p>col8</p></div>
        </div>
        
    </body>
</html>
