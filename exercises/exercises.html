<!DOCTYPE html>
<html>
    <head>
        <title>
            Images practice
        </title>
    <style>
        .cat {
            width: 200px;
            border-radius: 10px;
        }
        .cat2 {
            width: 105px;
            height: 105px;
            object-fit: cover;
            object-position: center;
            margin-left: 20px;
        }
        .cat3 {
            width: 105px;
            height: 105px;
            object-fit: cover;
            object-position: center;
            border-radius: 100%;
            margin-left: 20px;
        }
    </style>
    
    </head>

<body>
        <img class="cat" src="original.jpg">
        <img class="cat2" src="original.jpg">
        <img class="cat3" src="original.jpg">
    </body>

</html>
