<!DOCTYPE html>
<html>
    <head>
        <title>
            Search Exercises
        </title>
        <style>
            p{
                font-family:Helvetica;
            }
            .email{
                color: rgb(88, 88, 88);
                font-size: 15px;
                margin-bottom: 5px;
            }
            .type{
                width: 300px;
                height: 30px;
                border-style: solid;
                border-width: 2px;
                border-color: rgb(30, 30, 30);
                border-radius: 4px;
                padding-left: 5px;
            }
            .terms{
                color: rgb(38, 38, 38);
                font-size: 13px;
                margin-top: 15px;
            }
            .button{
                width: 300px;
                height: 45px;
                background-color: rgb(1, 94, 144);
                color: white;
                font-size: 15px;
                border-style: none;
                border-radius: 20px;
                margin-top: 15px;

            }
        </style>
    </head>
    
    <body>
        <p class="email">Email</p>
        <input class= "type" type="email">
        <p class="terms">By clicking <strong>Agree & Join</strong>, you agree to the Privacy Policy.</p>
        <button class="button">
            Agree & Join
        </button>
    </body>
</html>
